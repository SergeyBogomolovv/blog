# PostgreSQL запускается в контейнере, приложение — в отдельных терминалах.
name: cleanhome
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/generate-secrets.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/generate-secrets.sh}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:?Run scripts/generate-secrets.sh}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Run scripts/generate-secrets.sh}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - cleaning_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cleaning_data:
